; HA Knob - Home Assistant controller for the LilyGo T-Encoder Pro
; All library versions are pinned exactly; see README.md "Library versions".

[platformio]
default_envs = t-encoder-pro

[env:t-encoder-pro]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
upload_port = COM14
monitor_port = COM14
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    moononournation/GFX Library for Arduino@1.5.0
    lvgl/lvgl@9.2.2
    lewisxhe/SensorLib@0.3.4
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
test_filter = embedded/*

; Test build (Tester only, never released): the main env plus the serial test input hook
; (plan-step7.md Q7-10: "TIN ..." lines). Flash with
; pio run -e t-encoder-pro-test -t upload; the normal build contains no trace of it.
[env:t-encoder-pro-test]
extends = env:t-encoder-pro
build_flags =
    ${env:t-encoder-pro.build_flags}
    -DHAKNOB_TEST_INPUT

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror
lib_deps =
    throwtheswitch/Unity@2.6.1
    bblanchon/ArduinoJson@7.4.3
test_ignore = embedded/*
